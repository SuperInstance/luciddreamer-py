[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "luciddreamer"
version = "0.1.1"
description = "Maritime intelligence system - distills cloud AI into compiled edge tiles"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["maritime", "intelligence", "edge", "tiles", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = []

[project.scripts]
luciddreamer = "luciddreamer.cli:main"

[tool.setuptools]
packages = ["luciddreamer"]
include-package-data = true

[tool.setuptools.package-data]
luciddreamer = ["py.typed"]
